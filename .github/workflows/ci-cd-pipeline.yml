name: CI/CD Realiza

on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
    branches: [main, dev]

jobs:
  backend:
    name: Backend (build e verificação)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Instalar dependências
        run: npm ci
      - name: Verificar tipos e compilar (TypeScript)
        run: npx tsc --noEmit

  frontend:
    name: Frontend (test e build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependências
        run: npm ci
      - name: Testes automatizados (Vitest)
        run: npx vitest run
      - name: Build de produção (Vite)
        run: npx vite build

  docker:
    name: Docker (validar e construir imagens)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Criar o .env a partir do exemplo
        run: cp .env.example .env
      - name: Validar o docker-compose.yml
        run: docker compose config --quiet
      - name: Construir as imagens
        run: docker compose build backend frontend notification-service

  deploy:
    name: Deploy (publicar imagens)
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io/${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v4
      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Definir a versão da imagem
        id: versao
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
      - name: Construir e publicar o backend
        run: |
          docker build -t $REGISTRY/realiza-backend:${{ steps.versao.outputs.tag }} -t $REGISTRY/realiza-backend:latest backend
          docker push --all-tags $REGISTRY/realiza-backend
      - name: Construir e publicar o frontend
        run: |
          docker build -t $REGISTRY/realiza-frontend:${{ steps.versao.outputs.tag }} -t $REGISTRY/realiza-frontend:latest frontend
          docker push --all-tags $REGISTRY/realiza-frontend
      - name: Construir e publicar o notification-service
        run: |
          docker build -t $REGISTRY/realiza-notification-service:${{ steps.versao.outputs.tag }} -t $REGISTRY/realiza-notification-service:latest notification-service
          docker push --all-tags $REGISTRY/realiza-notification-service