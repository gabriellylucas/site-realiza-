events {}

http {
    server {
        listen 80;
        server_name realiza.local;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name realiza.local;

        ssl_certificate /etc/nginx/certs/realiza.local.pem;
        ssl_certificate_key /etc/nginx/certs/realiza.local-key.pem;

        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-Content-Type-Options "nosniff";
        add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval';";
        add_header X-XSS-Protection "1; mode=block";

        location / {
            proxy_pass http://frontend:5173;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        location /api/ {
            proxy_pass http://backend:3000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}